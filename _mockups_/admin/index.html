:root {
    --ink: #111; --muted: #6b6b67; --faint: #8f8c85; --line: #d6d6d2; --well: #fbfbf9;
    --accent: #2f8a4f; --glow: color-mix(in srgb, var(--accent) 62%, #fff);
    --danger: #b3261e; --ok: #1f7a45;
    --slab: 'RB Slab', Rockwell, 'Rockwell Nova', serif;
    --slab-light: 'RB Slab Light', Rockwell, serif;
    --cjk: 'Noto Sans HK', 'PingFang HK', 'Microsoft JhengHei', 'Noto Sans CJK TC', sans-serif;
    --brush: linear-gradient(90deg, #cfcfcc, #efefed 14%, #d6d6d3 32%, #f4f4f2 52%, #d2d2cf 74%, #ececea 90%, #c9c9c6);
    --hit: 44px;
}
* { box-sizing: border-box; }
html { background: #eeefec; }
body { margin: 0; min-height: 100vh; font-family: var(--cjk); color: var(--ink); font-size: 16px; line-height: 1.5; background: radial-gradient(110% 110% at 30% 12%, #fff, #eeefec) fixed; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.latin { font-family: var(--slab); }
/* 專輯色喺 .app / .disc / .album 設定；亮燈顏色要喺同一個元素重新計 */
.app, .disc, .album { --glow: color-mix(in srgb, var(--accent) 62%, #fff); }

/* 設計稿自己嘅切換列（唔屬於管理端） */
.switch { position: relative; z-index: 20; display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 16px; background: #161616; color: #ddd; font-size: 13px; align-items: center; }
.switch b { margin-right: 6px; color: #fff; }
.switch button { min-height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid #555; background: none; color: #ddd; }
.switch button[aria-pressed="true"] { background: #fff; color: #111; border-color: #fff; }

.app { max-width: 1240px; margin: 0 auto; padding: 20px 16px 80px; }

/* 鋁面板：拉絲鋁 + 四角螺絲；內容放喺凹入去嘅白色槽入面 */
.plate { position: relative; border-radius: 22px; padding: 30px; background: var(--brush); box-shadow: inset 0 1px 0 #fff, inset 0 -1px 0 #9a9a96, 0 0 0 1px rgba(95, 95, 95, .45), 0 14px 30px rgba(0, 0, 0, .14); }
.plate + .plate { margin-top: 22px; }
.screw { position: absolute; width: 18px; height: 18px; }
.screw.tl { top: 7px; left: 7px; } .screw.tr { top: 7px; right: 7px; } .screw.bl { bottom: 7px; left: 7px; } .screw.br { bottom: 7px; right: 7px; }
.well { background: var(--well); border-radius: 14px; padding: 20px; box-shadow: inset 0 2px 7px rgba(0, 0, 0, .2), 0 1px 0 #fff; }

/* 頂部：一條鋁條，左右各一粒螺絲 */
.top { display: flex; align-items: center; gap: 16px; padding: 12px 38px; border-radius: 999px; margin-bottom: 22px; }
.top .screw { top: 50%; margin-top: -9px; } .top .screw.tl { left: 12px; } .top .screw.tr { right: 12px; }
.brand { font-family: var(--slab); font-size: 30px; line-height: 1; letter-spacing: .5px; background: none; border: 0; padding: 0; min-height: var(--hit); }
.brand small { font-family: var(--cjk); font-size: 14px; font-weight: 700; margin-left: 10px; color: var(--muted); letter-spacing: 2px; }
.top .who { margin-left: auto; font-size: 14px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* 掣：文字掣 = 鍵帽；主要動作 = 黑色（唱片夾嘅顏色） */
.key { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: var(--hit); padding: 0 20px; border-radius: 999px; border: 1px solid #8d8d89; background: linear-gradient(#fbfbfa, #dededb 50%, #bcbcb8); box-shadow: 0 2px 4px rgba(0, 0, 0, .22), inset 0 1px 0 #fff; font-weight: 700; white-space: nowrap; }
.key:active { transform: translateY(1px); box-shadow: 0 1px 2px rgba(0, 0, 0, .25), inset 0 1px 0 #fff; }
.key.primary { color: #fff; border-color: #000; background: radial-gradient(120% 140% at 38% 20%, #3a3b40, #17171a 55%, #070708); box-shadow: 0 2px 5px rgba(0, 0, 0, .4), inset 0 1px 0 rgba(255, 255, 255, .25); }
.key[disabled] { opacity: .45; cursor: default; }
.round { width: var(--hit); height: var(--hit); padding: 0; border: 0; background: none; border-radius: 50%; flex: none; }
.round svg { display: block; width: 100%; height: 100%; overflow: visible; }

h1, h2 { margin: 0; font-weight: 900; }
h1 { font-size: 26px; } h2 { font-size: 18px; }
.sub { color: var(--muted); font-size: 14px; }
.row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.spacer { flex: 1; }

/* 儀錶：同轉碟旋鈕同一個刻度弧 */
.gauges { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
.gauge { display: flex; align-items: center; gap: 6px; }
.gauge svg { width: 132px; height: 112px; flex: none; }
.gauge .num { font-family: var(--slab); font-size: 34px; line-height: 1; }
.gauge .num small { font-family: var(--slab-light); font-size: 17px; color: var(--muted); }
.gauge .lab { font-size: 14px; font-weight: 700; margin-top: 4px; }
.engrave { font-family: var(--slab-light), var(--cjk); letter-spacing: 3px; font-size: 13px; color: #6a6a66; text-shadow: 0 1px 0 #fff; }

/* 專輯 = 碟 */
.discs { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 22px 14px; }
.disc { display: block; width: 100%; padding: 8px 4px 10px; background: none; border: 0; border-radius: 16px; text-align: center; }
.disc:hover { background: rgba(0, 0, 0, .04); }
.disc svg { display: block; width: 100%; max-width: 176px; margin: 0 auto 6px; overflow: visible; }
.disc .name { font-weight: 900; font-size: 15px; line-height: 1.3; }
.disc .name.latin { font-size: 17px; font-weight: 400; }
.disc .meta { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.leds { display: inline-flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.led { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.led i { width: 11px; height: 11px; border-radius: 50%; background: #5a5a5a; box-shadow: inset 0 1px 2px rgba(0, 0, 0, .6), 0 1px 0 #fff; }
.led.on { color: var(--ink); }
.led.on i { background: var(--glow); box-shadow: 0 0 7px 2px var(--glow), inset 0 1px 1px rgba(255, 255, 255, .7); }

/* 專輯頁 */
.album { display: grid; grid-template-columns: 330px 1fr; gap: 22px; align-items: start; }
.album .plate + .plate { margin-top: 0; }
.deck svg { display: block; width: 100%; overflow: visible; }
.fields { display: grid; gap: 12px; margin-top: 14px; }
.field label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 4px; }
.field input { width: 100%; min-height: var(--hit); padding: 0 12px; border: 1px solid #b9b9b5; border-radius: 10px; background: #fff; box-shadow: inset 0 1px 3px rgba(0, 0, 0, .12); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.swatch { display: flex; align-items: center; gap: 10px; }
.swatch i { width: var(--hit); height: var(--hit); border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px #fff, 0 0 0 4px #9a9a96, 0 0 12px 2px var(--glow); flex: none; }

/* 歌曲行：好似播放端歌單 */
.tracks { list-style: none; margin: 12px 0 0; padding: 0; }
.tracks > li { border-top: 1px solid var(--line); }
.tracks > li:first-child { border-top: 0; }
.track { display: grid; grid-template-columns: 26px 44px 1fr auto 26px; align-items: center; gap: 8px; width: 100%; min-height: 56px; padding: 6px 4px; background: none; border: 0; text-align: left; border-radius: 10px; }
.track:hover { background: rgba(0, 0, 0, .04); }
.track .grip { color: #a2a29e; font-size: 16px; letter-spacing: -7px; cursor: grab; }
.track .no { font-family: var(--slab-light); font-size: 22px; color: var(--muted); }
.track .title { font-weight: 700; }
.track .title small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.track.dim .title { color: #9a9a96; }
.track .chev { color: var(--muted); transition: transform .16s; }
li.open .track .chev { transform: rotate(90deg); }
li.open { background: #f1f1ee; border-radius: 12px; box-shadow: inset 0 0 0 1px var(--line); }
.edit { display: grid; grid-template-columns: 1fr 250px; gap: 14px; padding: 4px 12px 14px 42px; }
.edit textarea { width: 100%; min-height: 330px; padding: 12px 14px; border: 1px solid #b9b9b5; border-radius: 10px; background: #fff; box-shadow: inset 0 1px 3px rgba(0, 0, 0, .12); line-height: 1.75; resize: vertical; }
.edit textarea.bad { border-color: var(--danger); }
.hint { font-size: 13px; color: var(--muted); }
.hint pre { margin: 6px 0 10px; padding: 10px 12px; border-radius: 10px; background: #e9e9e6; color: #333; font: 13px/1.7 var(--cjk); white-space: pre-wrap; }
.checks { list-style: none; margin: 0; padding: 0; font-size: 13.5px; display: grid; gap: 4px; }
.checks li::before { content: '✓  '; color: var(--ok); font-weight: 900; }
.checks li.err { color: var(--danger); font-weight: 700; }
.checks li.err::before { content: '✕  '; color: var(--danger); }
.checks li.note::before { content: '–  '; color: var(--muted); }
.extras { grid-column: 1 / -1; border-top: 1px solid var(--line); padding-top: 4px; }
.extras summary { min-height: var(--hit); display: flex; align-items: center; cursor: pointer; font-size: 14px; font-weight: 700; color: var(--muted); }
.extras-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; padding-bottom: 8px; }
.field select { width: 100%; min-height: var(--hit); padding: 0 12px; border: 1px solid #b9b9b5; border-radius: 10px; background: #fff; box-shadow: inset 0 1px 3px rgba(0, 0, 0, .12); font: inherit; }
.edit .bar { grid-column: 1 / -1; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.danger-link { background: none; border: 0; color: var(--danger); min-height: var(--hit); padding: 0 8px; font-weight: 700; }
.add { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 56px; padding: 6px 4px 6px 34px; background: none; border: 0; color: var(--muted); font-weight: 700; text-align: left; }

/* 對話框、登入、提示 */
.scrim { position: fixed; inset: 0; background: rgba(20, 20, 20, .55); display: grid; place-items: center; padding: 16px; z-index: 5; }
.dialog { width: min(680px, 100%); max-height: 90vh; overflow: auto; }
.scan { list-style: none; margin: 0; padding: 0; font-size: 14px; }
.scan li { display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.scan li:first-child { border-top: 0; }
.scan code { font: 13px ui-monospace, Menlo, monospace; color: #444; word-break: break-all; }
.tag { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: #e4e4e0; color: #444; white-space: nowrap; }
.tag.warn { background: #fde9c8; color: #7a4a00; }
.login { min-height: calc(100vh - 60px); display: grid; place-items: center; padding: 16px; }
.login .plate { width: min(440px, 100%); text-align: center; }
.login .brand { font-size: 54px; min-height: 0; }
.google { width: 100%; background: #fff; border-color: #b9b9b5; margin-top: 18px; }
.toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); z-index: 9; display: flex; align-items: center; gap: 10px; padding: 12px 20px; border-radius: 999px; color: #fff; background: radial-gradient(120% 140% at 38% 20%, #3a3b40, #17171a 55%, #070708); box-shadow: 0 8px 22px rgba(0, 0, 0, .35); font-weight: 700; white-space: nowrap; }
.toast i { width: 11px; height: 11px; border-radius: 50%; background: #7dffb0; box-shadow: 0 0 8px 2px #7dffb0; }

@media (max-width: 900px) {
    .album { grid-template-columns: 1fr; }
    .edit { grid-template-columns: 1fr; padding-left: 12px; }
    .plate { padding: 26px 18px; }
    .top { padding: 10px 40px; }
    .top .who { display: none; }
    .top .round { margin-left: auto; }
    .brand { font-size: 26px; }
    .deck svg { max-width: 230px; margin: 0 auto; }
    .track { grid-template-columns: 22px 38px 1fr 22px; }
    .track .leds { grid-column: 3 / 4; grid-row: 2; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

E3%80%90apollo-18%E3%80%91/","note":"Apollo 18 track 12"},{"no":13,"title":"城記","subtitle":null,"composer":"藝琛","lyricist":"6號","arranger":"RubberBand","producer":"雷頌德 / RubberBand","lyricsUrl":"https://www.littleoslo.com/lyc/home/rubberband%E3%80%80%E3%80%90apollo-18%E3%80%91/","note":"Apollo 18 track 13. 藝琛 = 阿偉 (黎藝琛)"},{"no":14,"title":"脫逃","subtitle":null,"composer":"阿正 / 6號","lyricist":"6號","arranger":"RubberBand","producer":"雷頌德 / RubberBand","lyricsUrl":"https://www.littleoslo.com/lyc/home/rubberband%E3%80%80%E3%80%90apollo-18%E3%80%91/","note":"Apollo 18 track 14"},{"no":15,"title":"認錯","subtitle":"Bonus Track","composer":"李驥","lyricist":"李驥","arranger":"RubberBand","producer":"雷頌德 / RubberBand","lyricsUrl":"https://www.littleoslo.com/lyc/home/rubberband%E3%80%80%E3%80%90apollo-18%E3%80%91/","note":"Bonus Track · Apollo 18 bonus track (track 15). Cover of 優客李林 (Ukulele) Mandarin song 認錯 (1991), written by 李驥"}]};
    const DEMO_ID = 'apollo-18';
    const DEMO = DATA.albums.find((album) => album.id === DEMO_ID);
    // 示意數字：[有音檔, 有歌詞, 有 MV]；其他專輯當未上載
    const MEDIA = { 'apollo-18': [14, 11, 4], komorebi: [12, 6, 2], juntos: [9, 5, 1], hours: [9, 3, 2], i: [9, 0, 0] };

    /* ---------- 工具 ---------- */
    const n = (v) => Math.round(v * 10) / 10;

    const esc = (text) => String(text ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
    const isLatin = (text) => /^[\x20-\x7e¿…]+$/.test(text);
    const pad = (no) => String(no).padStart(2, '0');
    const mediaOf = (album) => MEDIA[album.id] ?? [0, 0, 0];

    /* ---------- 車床拉絲面（同播放端 buildLathe 一樣） ---------- */
    const buildLathe = () => {
        const WEDGES = 96;
        const step = 360 / WEDGES;
        let wedges = '';
        for (let i = 0; i < WEDGES; i += 1) {
            const a = i * step;
            const light = 0.76 + 0.15 * Math.cos(rad(2 * a)) + 0.045 * Math.cos(rad(6 * a + 40)) + 0.02 * Math.cos(rad(14 * a));
            const v = Math.round(Math.max(0, Math.min(1, light)) * 255);
            const [x1, y1] = polar(0, 0, 1, a - 0.2);
            const [x2, y2] = polar(0, 0, 1, a + step + 0.2);
            wedges += `<path d="M0 0L${x1.toFixed(4)} ${y1.toFixed(4)}A1 1 0 0 1 ${x2.toFixed(4)} ${y2.toFixed(4)}Z" fill="rgb(${v},${v},${v})"/>`;
        }
        document.getElementById('defs').insertAdjacentHTML('beforeend', `<g id="lathe">${wedges}</g>`);
    };
    const shadow = (cx, cy, r, { dx = 3, dy = 5, opacity = 0.3 } = {}) => `<circle cx="${cx + dx}" cy="${cy + dy}" r="${r}" fill="#000" opacity="${opacity}" filter="url(#fShadow)"/>`;
    const metal = (cx, cy, r, { rot = 24, bevel = 0.1, withShadow = true } = {}) => {
        const bw = r * bevel;
        return (
            (withShadow ? shadow(cx, cy, r) : '') +

            `<circle cx="${cx}" cy="${cy}" r="${r}" fill="url(#gDome)"/>` +
            `<circle cx="${cx}" cy="${cy}" r="${n(r - bw / 2)}" fill="none" stroke="url(#gBevel)" stroke-width="${n(bw)}"/>` +

    };
    const screw = (corner) =>
        `<svg class="screw ${corner}" viewBox="-12 -12 24 24" aria-hidden="true">${metal(0, 0, 11, { rot: 70, bevel: 0.2, withShadow: false })}` +

    const screws = () => ['tl', 'tr', 'bl', 'br'].map(screw).join('');
    const plate = (inner, cls = '') => `<section class="plate ${cls}">${screws()}${inner}</section>`;

    /* ---------- 金屬圓掣（同播放端細掣一樣）+ icon ---------- */
    const ICONS = {
        scan: '<path d="M-9 -9h5M-9 -9v5M9 -9h-5M9 -9v5M-9 9h5M-9 9v-5M9 9h-5M9 9v-5M-6 0h12" fill="none" stroke-width="2.4" stroke-linecap="round"/>',

    };
    const roundButton = (name, label, act) =>
        `<button class="round" data-act="${act}" aria-label="${label}" title="${label}"><svg viewBox="-24 -24 48 48">${metal(0, 0, 19)}<g stroke="#2e2e2e">${ICONS[name]}</g></svg></button>`;

    /* ---------- 碟：空心 CD 放喺轉盤上，中間係唱片夾；夾上面嘅圈 = 音檔完整度，字 = 字母盤標記 ---------- */
    const discSvg = (album) => {
        const [audio] = mediaOf(album);
        const R = 100;
        const ring = 27;
        const share = album.tracks ? audio / album.tracks : 0;
        const [ex, ey] = polar(0, 0, ring, -90 + share * 359.9);
        const latinKey = isLatin(album.key);
        const cover = NO_COVER.has(album.id)
            ? `<circle r="${R - 6}" fill="#d9d9d5"/><text y="-56" text-anchor="middle" font-size="13" font-weight="700" fill="#7a7a76" font-family="var(--cjk)">未有封面</text>`
            : `<circle r="${R - 6}" fill="${album.accent}"/><circle cx="-34" cy="-30" r="38" fill="#fff" opacity=".13"/><circle cx="40" cy="26" r="46" fill="#000" opacity=".12"/><circle cx="30" cy="-48" r="20" fill="#fff" opacity=".14"/>`;
        return (
            `<svg viewBox="-112 -112 224 228" role="img" aria-label="${esc(album.title)}：音檔 ${audio}／${album.tracks}">` +
            shadow(0, 4, R + 6, { dx: 0, dy: 6, opacity: 0.22 }) + metal(0, 0, R + 6, { rot: 12, bevel: 0.012, withShadow: false }) +
            cover + `<circle r="${R - 6}" fill="url(#gSheen)"/><circle r="${R - 6}" fill="none" stroke="#e9e9e6" stroke-width="3"/>` +
            `<circle r="40" fill="#fff" opacity=".42"/><circle r="40" fill="none" stroke="#fff" stroke-opacity=".8" stroke-width="1.5"/>` +
            shadow(0, 0, 33, { opacity: 0.4 }) + `<circle r="33" fill="url(#gCyl)"/><circle r="30" fill="url(#gClamp)"/>` +
            `<circle r="${ring}" fill="none" stroke="#fff" stroke-opacity=".16" stroke-width="3"/>` +
            (share > 0 ? `<path d="M0 ${-ring}A${ring} ${ring} 0 ${share > 0.5 ? 1 : 0} 1 ${n(ex)} ${n(ey)}" fill="none" stroke="var(--glow)" stroke-width="3.4" stroke-linecap="round"/>` : '') +
            `<text text-anchor="middle" dominant-baseline="central" font-size="${latinKey ? 26 : 20}" font-weight="${latinKey ? 400 : 900}" fill="#fff" font-family="${latinKey ? 'var(--slab)' : 'var(--cjk)'}">${esc(album.key)}</text>` +
            `</svg>`
        );
    };

    /* ---------- 儀錶：轉碟旋鈕嘅刻度弧（185° 至 376.25°）；著咗嘅刻度 = 完成比例 ---------- */
    const SCALE = { from: 185, to: 376.25, ticks: 18, inner: 44, outer: 54, long: 60 };
    const gauge = (label, have, total) => {
        const share = total ? have / total : 0;
        const lit = Math.round(share * (SCALE.ticks - 1));
        const angle = (i) => SCALE.from + (i * (SCALE.to - SCALE.from)) / (SCALE.ticks - 1);
        let ticks = '';
        for (let i = 0; i < SCALE.ticks; i += 1) {
            const on = i <= lit && have > 0;
            const [x1, y1] = polar(0, 0, SCALE.inner, angle(i));
            const [x2, y2] = polar(0, 0, on || i % 4 === 0 ? SCALE.long : SCALE.outer, angle(i));
            ticks += `<path d="M${n(x1)} ${n(y1)}L${n(x2)} ${n(y2)}" stroke="${on ? '#111' : '#9b9b97'}" stroke-width="${on ? 3 : 1.4}" stroke-linecap="round"/>`;
        }
        const knob = shadow(0, 0, 36, { dx: 4, dy: 7, opacity: 0.34 }) + `<circle r="36" fill="url(#gCyl)" stroke="#5f5f5f" stroke-width="1"/>` +
            `<circle r="33" fill="none" stroke="#6b6b6b" stroke-opacity=".7" stroke-width="5" stroke-dasharray="2 2.8"/>` + metal(0, 0, 29, { bevel: 0.07, withShadow: false }) +
            `<path d="M12 0H24" stroke="#111" stroke-width="4.5" stroke-linecap="round" transform="rotate(${n(angle(lit))})"/>`;
        return (
            `<div class="gauge"><svg viewBox="-66 -66 132 112" role="img" aria-label="${label}：${have}／${total}">${ticks}${knob}</svg>` +
            `<div><div class="num">${have}<small>／${total}</small></div><div class="lab">${label}</div></div></div>`
        );
    };
    const totals = () => {
        const sum = { albums: DATA.albums.length, tracks: 0, audio: 0, lyrics: 0, mv: 0, covers: 0 };
        DATA.albums.forEach((album) => {
            const [audio, lyrics, mv] = mediaOf(album);
            sum.tracks += album.tracks; sum.audio += audio; sum.lyrics += lyrics; sum.mv += mv;
            sum.covers += NO_COVER.has(album.id) ? 0 : 1;
        });
        return sum;
    };

    /* ---------- 畫面 ---------- */
    const state = { screen: 'albums', open: null, bad: false, adding: false, toast: '' };
    const SCREENS = [['albums', '專輯'], ['album', '專輯頁'], ['edit', '修改歌曲'], ['bad', '修改歌曲（格式有錯）'], ['add', '新增歌曲'], ['scan', '掃描結果'], ['login', '登入'], ['denied', '沒有權限']];

    const top = () =>
        `<header class="plate top">${screw('tl')}${screw('tr')}<button class="brand" data-act="home" aria-label="R Gram 內容管理：返回專輯">R Gram<small>內容管理</small></button>` +
        `<span class="who">admin@example.com</span>${roundButton('out', '登出', 'logout')}</header>`;

    const led = (on, label) => `<span class="led ${on ? 'on' : ''}"><i></i>${label}</span>`;

    const albums = () => {
        const sum = totals();
        const cards = DATA.albums.map((album) => {
            const [audio, lyrics] = mediaOf(album);
            return (
                `<button class="disc" data-act="open-album" style="--accent: ${album.accent}">${discSvg(album)}` +
                `<div class="name ${isLatin(album.title) ? 'latin' : ''}">${esc(album.title)}</div>` +
                `<div class="meta">${album.year ?? '—'} · ${album.tracks} 首</div><div class="meta">音檔 ${audio}／${album.tracks} · 歌詞 ${lyrics}／${album.tracks}</div></button>`
            );
        }).join('');
        return (
            plate(`<div class="row" style="margin-bottom: 10px"><span class="engrave">${sum.albums} 隻碟 · ${sum.tracks} 首歌</span><span class="spacer"></span><span class="sub">所有修改一儲存就即時在播放端生效</span></div>` +
                `<div class="well gauges">${gauge('歌曲已有音檔', sum.audio, sum.tracks)}${gauge('歌曲已有歌詞', sum.lyrics, sum.tracks)}${gauge('歌曲已有 MV', sum.mv, sum.tracks)}${gauge('專輯已有封面', sum.covers, sum.albums)}</div>`) +
            plate(`<div class="row" style="margin-bottom: 12px"><h1>專輯</h1><span class="spacer"></span><button class="key" data-act="toast-new">＋ 新增專輯</button></div>` +
                `<div class="well"><div class="discs">${cards}</div></div>` +
                `<p class="sub" style="margin: 12px 4px 0">碟中間的字是轉碟字母盤上的標記；外圈亮起的部分是已有音檔的歌曲比例。拖動可以改變次序。</p>`)
        );
    };

    const songText = (track, { bad = false, blank = false } = {}) => {
        if (blank) return '';
        const credit = (label, value) => (value ? `${label}：${value}` : null);
        const head = [track.title, credit('副題', track.subtitle), credit('曲', track.composer), credit('詞', track.lyricist), credit('編', track.arranger), credit('監', track.producer)].filter(Boolean);
        const lyrics = ['[00:12.30]歌詞第一行（佔位）', '[00:16.80]歌詞第二行（佔位）', bad ? '歌詞第三行（佔位）' : '[00:21.45]歌詞第三行（佔位）', '[00:26.10]歌詞第四行（佔位）', '[00:31.90]歌詞第五行（佔位）'];
        return [...head, '', ...lyrics].join('\n');
    };
    const FORMAT = '歌名\n曲：作曲人\n詞：填詞人\n編：編曲人\n監：監製\n\n[00:12.30]第一句歌詞\n[00:18.75]第二句歌詞';
    const BAD_LYRIC_INDEX = 3; // 示意：第三句歌詞漏咗時間標記
    const checks = (track, { bad, blank }) => {
        if (blank) return `<li class="note">第一行輸入歌名</li><li class="note">「曲：」「詞：」「編：」「監：」可以省略</li><li class="note">歌詞可以稍後再加</li>`;
        const credits = ['composer', 'lyricist', 'arranger', 'producer'].filter((k) => track[k]).length;
        const badLine = 1 + (track.subtitle ? 1 : 0) + credits + 1 + BAD_LYRIC_INDEX; // 歌名 + 副題 + 曲詞編監 + 空行 + 第幾句
        return (
            `<li>歌名：${esc(track.title)}</li><li>曲、詞、編、監：已填 ${credits} 項</li>` +
            (bad ? `<li class="err">第 ${badLine} 行沒有時間標記（其他歌詞行都有）。請補上，或者全部歌詞都不加時間標記。</li>` : `<li>歌詞 5 行，全部有時間標記</li>`)
        );
    };
    // 文字框下面嘅細控件（D37）：只喺管理端用，唔會喺播放端顯示
    const fileSelect = (id, label, auto) =>
        `<div class="field"><label for="${id}">${label}</label><select id="${id}"><option>${auto ? `自動配對：${esc(auto)}` : '未有檔案'}</option><option>手動指定…</option></select></div>`;
    const extras = (track, { blank }) => {
        const audio = !blank && track.no !== NO_AUDIO_TRACK ? `${pad(track.no)} ${track.title}.m4a` : null;
        const mv = !blank && MV_TRACKS.has(track.no) ? `${pad(track.no)} ${track.title}.mp4` : null;
        return (
            `<details class="extras"><summary>其他：參考連結、備註、媒體檔</summary><div class="extras-grid">` +
            `<div class="field"><label for="x-url">歌詞參考連結</label><input id="x-url" value="${esc(blank ? '' : (track.lyricsUrl ?? ''))}" placeholder="https://"></div>` +
            `<div class="field"><label for="x-note">備註</label><input id="x-note" value="${esc(blank ? '' : (track.note ?? ''))}"></div>` +
            fileSelect('x-audio', '音檔', audio) + fileSelect('x-mv', 'MV', mv) +
            `</div></details>`
        );
    };
    const editor = (track, mode = {}) =>
        `<div class="edit"><div><label class="sub" for="song">歌曲資料及歌詞</label>` +
        `<textarea id="song" class="${mode.bad ? 'bad' : ''}" spellcheck="false" placeholder="${esc(FORMAT)}" aria-describedby="checks">${esc(songText(track, mode))}</textarea></div>` +
        `<div class="hint"><b>格式</b><pre>${esc(FORMAT)}</pre>第一行一定是歌名。「曲：」「詞：」「編：」「監：」可以省略；有副題（例如 Live）可以加一行「副題：」。歌詞可以有時間標記（會跟隨歌曲顯示），也可以完全不加。` +
        `<div style="margin-top: 12px"><b>檢查結果</b></div><ul class="checks" id="checks" aria-live="polite">${checks(track, mode)}</ul></div>` +
        extras(track, mode) +
        `<div class="bar"><button class="key primary" data-act="save" ${mode.bad ? 'disabled' : ''}>儲存</button><button class="key" data-act="collapse">取消</button><span class="spacer"></span>` +
        (mode.blank ? '' : `<button class="danger-link" data-act="toast-delete">刪除這首歌</button>`) + `</div></div>`;

    const trackRow = (track) => {
        const open = state.open === track.no && !state.adding;
        const audio = track.no !== NO_AUDIO_TRACK;
        const lyrics = track.no < NO_LYRICS_FROM;
        return (
            `<li class="${open ? 'open' : ''}"><button class="track ${audio ? '' : 'dim'}" data-act="toggle" data-no="${track.no}" aria-expanded="${open}">` +
            `<span class="grip" aria-hidden="true">⋮⋮</span><span class="no">${pad(track.no)}</span>` +
            `<span class="title">${esc(track.title)}${track.subtitle ? `<small>${esc(track.subtitle)}</small>` : ''}</span>` +
            `<span class="leds">${led(audio, '音檔')}${led(MV_TRACKS.has(track.no), 'MV')}${led(lyrics, '歌詞')}</span><span class="chev" aria-hidden="true">›</span></button>` +
            (open ? editor(track, { bad: state.bad }) : '') + `</li>`
        );
    };

    const album = () => {
        const [audio, lyrics, mv] = mediaOf(DEMO);
        const left = plate(
            `<div class="deck">${discSvg(DEMO)}</div>` +
            `<div class="row" style="justify-content: center"><button class="key" data-act="toast-cover">更換封面</button></div>` +
            `<div class="well fields" style="margin-top: 16px">` +
            `<div class="field"><label for="f-title">專輯名</label><input id="f-title" value="${esc(DEMO.title)}"></div>` +
            `<div class="two"><div class="field"><label for="f-date">發行日期</label><input id="f-date" value="${esc(DEMO.releaseDate ?? '')}"></div>` +
            `<div class="field"><label for="f-key">字母盤標記</label><input id="f-key" value="${esc(DEMO.key)}" maxlength="2"></div></div>` +
            `<div class="field"><label for="f-colour">專輯色（亮燈顏色跟隨）</label><div class="swatch"><i></i><input id="f-colour" value="${DEMO.accent}"></div></div>` +
            `<div class="row"><button class="key primary" data-act="save-album">儲存</button><span class="sub">由封面自動抽色，可以自行修改</span></div></div>`,
        );
        const right = plate(
            `<div class="row">${roundButton('back', '返回專輯', 'home')}` +
            `<h1 class="${isLatin(DEMO.title) ? 'latin' : ''}" style="font-weight: 400; font-size: 30px">${esc(DEMO.title)}</h1><span class="spacer"></span>` +
            `<span class="leds">${led(true, `音檔 ${audio}／${DEMO.tracks}`)}${led(true, `MV ${mv}`)}${led(true, `歌詞 ${lyrics}／${DEMO.tracks}`)}</span></div>` +
            `<div class="well" style="margin-top: 14px"><div class="row"><h2>歌曲</h2><span class="spacer"></span><span class="sub">掃描媒體檔</span>${roundButton('scan', '掃描媒體檔', 'scan')}</div>` +
            `<ul class="tracks">${DATA.tracks.map(trackRow).join('')}` +
            `<li class="${state.adding ? 'open' : ''}"><button class="add" data-act="add" aria-expanded="${state.adding}">＋ 新增歌曲</button>${state.adding ? editor({}, { blank: true }) : ''}</li></ul></div>`,
        );
        return `<div class="album" style="--accent: ${DEMO.accent}">${left}${right}</div>`;
    };

    const SCAN = [
        ['ok', `01 ${DATA.tracks[0].title}.m4a`, '第 01 首 · 音檔', '已配對'], ['ok', `01 ${DATA.tracks[0].title}.mp4`, '第 01 首 · MV', '已配對'], ['ok', `02 ${DATA.tracks[1].title}.m4a`, '第 02 首 · 音檔', '已配對'],
        ['warn', '07 a.m4a、07 b.m4a', '第 07 首 · 音檔有兩個檔案', '請選擇'], ['none', 'bonus-demo.m4a', '找不到對應的歌號', '未配對'],
    ];
    const scanDialog = () =>
        `<div class="scrim"><div class="dialog" role="dialog" aria-modal="true" aria-label="掃描結果">` +
        plate(`<h1>掃描結果</h1><p class="sub" style="margin: 4px 0 12px">在 R2 的「apollo-18/」找到 31 個檔案：28 個已配對、1 個要選擇、2 個未配對。</p>` +
            `<div class="well"><ul class="scan">${SCAN.map(([kind, file, target, tag]) =>
                `<li><span class="led ${kind === 'ok' ? 'on' : ''}"><i></i></span><span><code>${esc(file)}</code><br><span class="sub">${target}</span></span><span class="tag ${kind === 'ok' ? '' : 'warn'}">${tag}</span></li>`).join('')}</ul></div>` +
            `<div class="row" style="margin-top: 16px"><button class="key primary" data-act="apply-scan">套用已配對的 28 個</button><button class="key" data-act="close-scan">取消</button></div>`) +
        `</div></div>`;

    const GOOGLE = '<svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.2C12.400 13.700 17.700 9.500 24 9.500z"/><path fill="#4285F4" d="M46.100 24.500c0-1.600-.100-3.100-.400-4.500H24v9h12.400c-.500 2.900-2.200 5.300-4.600 7l7.200 5.600c4.200-3.900 7.100-9.600 7.100-17.100z"/><path fill="#FBBC05" d="M10.500 28.600A14.500 14.500 0 0 1 9.500 24c0-1.600.300-3.200.800-4.600l-7.900-6.200A24 24 0 0 0 0 24c0 3.900.900 7.500 2.600 10.800z"/><path fill="#34A853" d="M24 48c6.500 0 11.900-2.100 15.900-5.800l-7.200-5.600c-2.200 1.500-5 2.400-8.700 2.400-6.300 0-11.600-4.200-13.500-9.900l-7.900 6.200C6.500 42.600 14.600 48 24 48z"/></svg>';
    const login = (denied) =>
        `<div class="login">${plate(
            `<div class="brand">R Gram</div><div class="engrave" style="margin-top: 6px">內容管理</div>` +
            `<div class="well" style="margin-top: 20px">` +
            (denied
                ? `<h2>這個帳戶沒有管理權限</h2><p class="sub">admin@example.com 不在管理員名單內。</p><button class="key" style="width: 100%" data-act="logout">改用其他帳戶登入</button>`
                : `<p class="sub" style="margin: 0">只限管理員使用</p><button class="key google" data-act="home">${GOOGLE} 使用 Google 帳戶登入</button>`) +
            `</div><p class="sub" style="margin: 14px 0 0">歌迷自製 · 非官方</p>`)}</div>`;

    const BODY = { albums, album, edit: album, bad: album, add: album, scan: album };
    const render = () => {
        document.getElementById('switch').innerHTML = SCREENS.map(([id, name]) => `<button data-screen="${id}" aria-pressed="${state.screen === id}">${name}</button>`).join('');
        const screen = state.screen;
        const body = screen === 'login' || screen === 'denied' ? login(screen === 'denied') : `<div class="app" style="--accent: ${DEMO.accent}">${top()}${BODY[screen]()}</div>${screen === 'scan' ? scanDialog() : ''}`;
        document.getElementById('root').innerHTML = body + (state.toast ? `<div class="toast" role="status"><i></i>${state.toast}</div>` : '');
    };

    const TOAST_MS = 2200;
    const DEMO_OPEN_TRACK = 2;
    const flash = (text) => { state.toast = text; setTimeout(() => { state.toast = ''; render(); }, TOAST_MS); };
    const go = (screen) => Object.assign(state, { screen, open: screen === 'edit' || screen === 'bad' ? DEMO_OPEN_TRACK : null, bad: screen === 'bad', adding: screen === 'add' });
    const SAVED = '已儲存，播放端已更新';
    const ACTIONS = {
        home: () => go('albums'),
        logout: () => go('login'),
        'open-album': () => go('album'),
        toggle: (el) => { const no = Number(el.dataset.no); Object.assign(state, { open: state.open === no ? null : no, adding: false, bad: false, screen: state.open === no ? 'album' : 'edit' }); },
        add: () => Object.assign(state, { adding: !state.adding, open: null, screen: state.adding ? 'album' : 'add' }),
        collapse: () => go('album'),
        save: () => { go('album'); flash(SAVED); },
        'save-album': () => flash(SAVED),
        scan: () => go('scan'),
        'close-scan': () => go('album'),
        'apply-scan': () => { go('album'); flash('已套用 28 個檔案，播放端已更新'); },
        'toast-new': () => flash('示意：新增一隻空白的碟，然後填寫資料'),
        'toast-cover': () => flash('示意：選擇圖片，裁切成正方形，然後儲存'),
        'toast-delete': () => flash('示意：先確認，然後刪除'),
    };
    document.addEventListener('click', (event) => {
        const tab = event.target.closest('[data-screen]');
        const act = event.target.closest('[data-act]');
        if (tab) go(tab.dataset.screen);
        else if (act && !act.disabled) ACTIONS[act.dataset.act](act);
        else return;
        render();
    });
    buildLathe();
    render();
})();
</script>
</body>
</html>
