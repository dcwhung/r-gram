# r-gram-api：內容管理 Backend（Technical Spec「部署架構」）。
# 部署值由用戶提供（U-3、U-4、U-7，2026-11-26）；secret（GOOGLE_CLIENT_SECRET、SESSION_SECRET）唔入 repo。
name = "r-gram-api"
main = "src/index.ts"
compatibility_date = "2026-11-01"

# Admin SPA（apps/admin）由 static assets 出：apps/admin 未有（T-051），有咗先開返下面呢段
#（資料夾唔存在 wrangler 會報錯）。/api、/auth、/catalog 一律先行 Worker
# [assets]
# directory = "../admin/dist"
# not_found_handling = "single-page-application"
# run_worker_first = ["/api/*", "/auth/*", "/catalog/*"]

[[d1_databases]]
binding = "DB"
database_name = "r-gram"
# U-3：`wrangler d1 create r-gram` 印出嚟嘅 database_id
database_id = "ddbda0d8-d643-4e9a-bb59-ce712dceea8b"
migrations_dir = "migrations"

# private bucket（冇公開網址）：catalog.json、封面圖、歌詞 JSON 都經 Worker 出
[[r2_buckets]]
binding = "CATALOG"
bucket_name = "rb-discography-catalog"

# 媒體 bucket（公開網址直出；唯一資料來源，CR-007）：同步 list / head / get；只有 info.txt 同歌曲文字框
#（API-019、API-041，T-106）會寫：只寫專輯資料夾第一層嘅 info.txt 同 NN ….txt，要版本前提，永遠唔 delete
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "rb-discography"

# 非 secret 設定；GOOGLE_CLIENT_SECRET、SESSION_SECRET 用 `wrangler secret put`（本機：.dev.vars）。
# 只改呢個檔：每次 deploy 會蓋走 dashboard 嘅改動
[vars]
# U-4：Google Cloud OAuth client id（公開值，唔係 secret）
GOOGLE_CLIENT_ID = "87883666131-sc83f8q98o3tvg62uqkg1bdvqin1jplu.apps.googleusercontent.com"
# TODO(U-4)：管理員 Google 帳戶，逗號分隔（example.com 係保留網域：未填之前冇人登入到）
ADMIN_EMAILS = "admin@example.com"
# U-7：播放端網址，逗號分隔（CORS 只回呢度 match 到嘅 origin）
PLAYER_ORIGINS = "https://rgram.vercel.app"
# Worker 自己嘅 origin，唔好 / 結尾（OAuth redirect、CSRF Origin 檢查、catalog 圖 URL）；本機 .dev.vars 蓋做 https://localhost:8787
WORKER_ORIGIN = "https://r-gram-api.dcwhung.workers.dev"
# rb-discography 嘅公開網址（要 / 結尾）；r2.dev 係開發用，之後轉自訂網域只要改呢行
MEDIA_BASE = "https://pub-fd99bea8c79a485b8a7eb3847cea696c.r2.dev/"
